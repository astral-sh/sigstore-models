name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version from the merged release PR, without a leading v
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    name: Validate release
    if: github.repository == 'astral-sh/sigstore-models' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check release version and lockfile
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bash .github/scripts/check-release-version.sh "$VERSION"
          uv lock --check

  pypi:
    name: Publish to PyPI
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for PyPI trusted publishing + attestations

    environment:
      name: pypi.org
      url: https://pypi.org/p/sigstore-models

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Attest
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish to PyPI
        run: |
          uv publish --trusted-publishing=always dist/*

  github-release:
    name: Create GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the tag and GitHub Release.
    steps:
      - name: Tag the published commit and create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          prerelease=()
          if [[ "$VERSION" =~ (a|b|rc|\.dev)[0-9]+ ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes "${prerelease[@]}"
